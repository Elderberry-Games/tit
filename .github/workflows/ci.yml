name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Constitution merge gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage gate (>=85%)
        run: ./scripts/check-coverage.sh coverage.out 85

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
