# Constitution merge gates. Moved from GitHub Actions without a change to the checks.
# The Actions job used the latest stable Go. Update this pin when a new Go release comes out.
labels:
  platform: linux/amd64
when:
  - event: pull_request
  - event: push
    branch: main
steps:
  - name: gates
    image: golang:1.27.3-bookworm@sha256:dc0963f32053e4bc451d24d87e3892d42d01021b61f093e98eb95c0352bb84b0
    commands:
      - test -z "$$(gofmt -l . | tee /dev/stderr)"
      - go vet ./...
      - go build ./...
      - go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - ./scripts/check-coverage.sh coverage.out 85
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...
